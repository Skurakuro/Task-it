# Codemagic: compila o Task-it para iPhone num Mac na nuvem e envia para o TestFlight.
# Antes do primeiro build, no Codemagic:
#   Personal Account > Integrations > Developer Portal > Connect
#   e cadastre a chave da API do App Store Connect com o nome  TaskitASC
workflows:
  ios-testflight:
    name: Task-it iPhone -> TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: TaskitASC
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.taskit.notes
      vars:
        XCODE_PROJECT: celular/ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: 22
      xcode: latest
    scripts:
      - name: Instalar dependências
        script: |
          npm install --omit=dev --ignore-scripts
          cd celular
          npm install
      - name: Copiar o app do celular e sincronizar com o iOS
        script: |
          cd celular
          node copy-web.js
          npx cap sync ios
      - name: Ajustes do Info.plist (criptografia padrão = isento)
        script: |
          PLIST=celular/ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" || \
          /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
      - name: Configurar assinatura
        script: xcode-project use-profiles
      - name: Número do build
        script: |
          cd celular/ios/App
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Compilar o app (.ipa)
        script: |
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  ios-sideload:
    name: Task-it iPhone - Sideloadly (sem conta paga Apple)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Instalar dependências
        script: |
          npm ci --omit=dev --ignore-scripts
          cd celular
          npm ci
      - name: Preparar app iOS
        script: |
          cd celular
          node copy-web.js
          npx cap sync ios
      - name: Compilar para iPhone sem assinatura
        script: |
          xcodebuild -project celular/ios/App/App.xcodeproj \
            -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-sideload \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" build
      - name: Empacotar IPA para assinatura pelo Sideloadly
        script: |
          set -eu
          APP="$CM_BUILD_DIR/build/ios-sideload/Build/Products/Release-iphoneos/App.app"
          test -d "$APP"
          mkdir -p "$CM_BUILD_DIR/build/sideload/Payload"
          ditto "$APP" "$CM_BUILD_DIR/build/sideload/Payload/App.app"
          cd "$CM_BUILD_DIR/build/sideload"
          /usr/bin/zip -qry Task-it-unsigned.ipa Payload
    artifacts:
      - build/sideload/Task-it-unsigned.ipa
