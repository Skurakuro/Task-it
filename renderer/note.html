<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' data: blob:" />
  <title>Task-it</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="note-page">
  <header class="note-bar">
    <button id="listBtn" class="icon" title="Abrir a lista de notas">
      <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
    </button>
    <button id="new" class="icon" title="Nova nota">
      <svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
    </button>
    <span class="drag"></span>
    <button id="pin" class="icon pin-btn" title="Fixar na tela">
      <svg viewBox="0 0 24 24"><path d="M15 3l6 6-2 1-3.5 3.5L16 18l-2 2-4-4-5 5H4v-1l5-5-4-4 2-2 4.5.5L15 6z"/></svg>
    </button>
    <button id="more" class="icon" title="Cor, áudio e excluir">
      <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
    </button>
    <button id="close" class="icon" title="Fechar">
      <svg viewBox="0 0 24 24"><path d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6 10.6 12 5 6.4z"/></svg>
    </button>
  </header>

  <div id="pinMenu" class="pop pin-pop" hidden>
    <button data-pin="top" title="Sempre por cima: continua na frente mesmo com Alt+Tab"><span class="pin-dot red"></span>Vermelho</button>
    <button data-pin="place" title="Preso no lugar: não arrasta; vai para trás das janelas com Alt+Tab"><span class="pin-dot blue"></span>Azul</button>
    <button data-pin="off" title="Solta a nota da tela"><span class="pin-dot"></span>Desafixar</button>
  </div>

  <div id="menu" class="menu" hidden>
    <div class="swatches" id="sw"></div>
    <div id="customRow" class="custom-row" hidden>
      <span id="customPreview" class="sw-preview"></span>
      <input id="customInput" placeholder="#RRGGBB ou 255,200,0" spellcheck="false" />
      <button id="customApply" class="chip">Aplicar</button>
    </div>
    <div class="menu-row">
      <button id="del" class="danger">
        <svg viewBox="0 0 24 24"><path d="M9 3h6l1 2h4v2H4V5h4zm-3 6h12l-1 12H7z"/></svg> Excluir nota
      </button>
      <span class="grow"></span>
      <button id="rec" class="rec-btn" title="Gravar uma nota de áudio">
        <svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zm-7 9h2a5 5 0 0 0 10 0h2a7 7 0 0 1-6 6.9V21h-2v-2.1A7 7 0 0 1 5 12z"/></svg>
        <span id="recLabel">Gravar áudio</span>
      </button>
    </div>
  </div>

  <input id="title" class="note-title" placeholder="Título / temática" spellcheck="false" />
  <div id="audios" class="audios"></div>
  <textarea id="text" placeholder="Anote algo…" spellcheck="false"></textarea>

  <script src="../shared/colors.js"></script>
  <script src="note.js"></script>
</body>
</html>
